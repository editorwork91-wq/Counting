plugins { id 'com.android.application' }

android {
    namespace 'com.yomy.countdown'
    compileSdk 35

    defaultConfig {
        applicationId 'com.yomy.countdown'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
