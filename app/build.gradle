plugins { id 'com.android.application' }

android {
    namespace 'com.yomy.counting'
    compileSdk 35

    defaultConfig {
        applicationId 'com.yomy.counting'
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName '1.0'
    }

    buildFeatures { buildConfig = true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
